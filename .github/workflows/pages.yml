name: GitHub Pages

# Статическая версия игры: папка public/ целиком уезжает на Pages.
# Данные (уровни, расширения, аккаунт) живут в localStorage браузера.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Тесты (сервер, движок, правила, локальный режим)
        run: npm test

      - name: Проверка, что статика не тянет серверные пути
        run: |
          if grep -rnE "(href|src)=\"/(css|js|sandbox)" public/index.html; then
            echo "Абсолютные пути сломают Pages в подкаталоге /repo/" >&2
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
